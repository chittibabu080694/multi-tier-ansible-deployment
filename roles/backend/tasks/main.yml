---
- name: Install Node.js runtime and npm
  apt:
    name:
      - nodejs
      - npm
    state: present

- name: Create application directory
  file:
    path: /opt/app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Configure environment variables file for app
  template:
    src: env.j2
    dest: /opt/app/.env
    owner: ubuntu
    group: ubuntu
    mode: '0600'
